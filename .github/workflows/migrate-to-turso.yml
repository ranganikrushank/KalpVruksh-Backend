
name: Copy PostgreSQL data to Turso

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install migration dependencies
        run: |
          python -m pip install 'psycopg2-binary>=2.9,<3' 'libsql-client>=0.3,<1'

      - name: Copy and verify records
        env:
          PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python migrate_postgres_to_turso.py
